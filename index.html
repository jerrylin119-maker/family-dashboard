<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --accent-blue: #38bdf8;
    --accent-gold: #fbbf24;
    --accent-green: #34d399;
    --accent-purple: #c084fc;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif; }

  /* ========================================================
     🖥️ 平板 / 電腦端：鎖定 100vh 不出現外層捲軸，維持原本比例
     ======================================================== */
  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    padding: 12px 16px;
    height: 100vh;
    overflow: hidden; /* 鎖定單頁不滾動 */
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  .header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 2px solid var(--accent-blue);
    border-radius: 12px;
    padding: 8px 16px;
    margin-bottom: 10px;
    gap: 12px;
  }

  .title-group h1 { font-size: 1.5rem; font-weight: 900; color: #ffffff; display: flex; align-items: center; gap: 8px; }
  .badge-home { background: #0284c7; color: white; font-size: 0.8rem; padding: 2px 8px; border-radius: 6px; }
  .sync-status { font-size: 0.8rem; color: var(--accent-green); margin-top: 4px; font-weight: bold; }

  .datetime-bar { display: flex; align-items: center; gap: 12px; }
  .date-display-large { font-size: 1.6rem; font-weight: 900; color: var(--accent-blue); }
  .clock-large { font-size: 2rem; font-weight: 900; font-family: "Courier New", monospace; color: var(--accent-gold); }

  .controls-group { display: flex; gap: 8px; }
  .btn-top { background: #334155; color: white; border: 1px solid #475569; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; white-space: nowrap; }

  /* 6 格卡片主佈局：自動填滿剩餘高度 */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
    flex: 1;
    min-height: 0; 
  }

  .section-card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .section-title {
    font-size: 1.15rem; font-weight: 900; margin-bottom: 10px; padding-bottom: 8px;
    border-bottom: 2px solid #334155; display: flex; justify-content: space-between; align-items: center;
  }

  /* 確保內容溢出時只在小格子內滑動 */
  .event-list {
    flex: 1;
    overflow-y: auto; 
    list-style: none; display: flex; flex-direction: column; gap: 8px;
  }

  .event-item {
    background: #0f172a; border-radius: 8px; padding: 8px 12px;
    display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;
  }

  .footer-routine {
    flex-shrink: 0; margin-top: 10px; background: #1e293b; border: 1px solid #334155;
    border-radius: 10px; padding: 8px 16px; display: flex; justify-content: space-between;
    font-size: 0.85rem; color: var(--text-muted);
  }

  /* ========================================================
     📱 手機端：解除高度限制，變成可往下滑動的單欄模式
     ======================================================== */
  @media (max-width: 768px) {
    body {
      height: auto !important;
      min-height: 100vh;
      overflow-y: auto !important; /* 開啟整頁向下捲動 */
      padding: 10px;
    }

    .header { flex-direction: column; align-items: stretch; gap: 10px; }
    .datetime-bar { justify-content: space-between; width: 100%; }
    .date-display-large { font-size: 1.2rem; }
    .clock-large { font-size: 1.5rem; }
    .controls-group { width: 100%; justify-content: space-between; }
    .btn-top { flex: 1; text-align: center; padding: 6px 4px; font-size: 0.75rem; }

    /* 解除 3x2 網格，改為 1 欄往下滑 */
    .dashboard-grid {
      grid-template-columns: 1fr !important;
      grid-template-rows: auto !important;
      gap: 12px;
      height: auto !important;
    }

    .section-card { min-height: auto; height: auto; }
    
    /* 解除小格子內部捲動，讓內容自然撐開以便整頁滑動 */
    .event-list { overflow-y: visible; }
    .footer-routine { flex-direction: column; gap: 6px; text-align: center; }
  }
</style>
